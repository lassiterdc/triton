#---------------------------------------------------------------------------
# Triton config file
#---------------------------------------------------------------------------

#---------------------------------------------------------------------------
# Mandatory input files
#---------------------------------------------------------------------------
dem_filename="../input/dem/asc/case01.dem"

#---------------------------------------------------------------------------
# Format=BIN or ASC
# Option=PAR or SEQ
#---------------------------------------------------------------------------
input_format=ASC
outfile_pattern="%s/%s/%s_%02d_%02d"
output_format=ASC
output_option=SEQ

#---------------------------------------------------------------------------
# Hydrograph and flow locations information
#---------------------------------------------------------------------------
num_sources=1
hydrograph_filename="../input/strmflow/case01.hyg"
src_loc_file="../input/strmflow/case01.txt"

#---------------------------------------------------------------------------
# Manning input files
#---------------------------------------------------------------------------
n_infile="../input/mann/asc/case01.mann"
const_mann=0.035

#---------------------------------------------------------------------------
# Runoff related information
#---------------------------------------------------------------------------
num_runoffs=0
#runoff_filename=""
#runoff_file=""

#---------------------------------------------------------------------------
# External boundaries
#---------------------------------------------------------------------------
num_extbc=0
extbc_dir="../input/extbc"
extbc_file=""

#---------------------------------------------------------------------------
# time_series_flag=1 to activate, 0 to deactivate
#---------------------------------------------------------------------------
observation_loc_file="../input/obs/case01.obs"
time_series_flag=0

#---------------------------------------------------------------------------
# print_option=h to output just the h, huv to output all h,u and v
#---------------------------------------------------------------------------
print_option=huv

#---------------------------------------------------------------------------
# Start and duration of simulation time in seconds
#---------------------------------------------------------------------------
sim_start_time=0
sim_duration=360

#---------------------------------------------------------------------------
# If checkpoint_id is 0 that means a clean start
#---------------------------------------------------------------------------
checkpoint_id=0

#---------------------------------------------------------------------------
# time_increment_fixed=0 is for variable dt, 1 for constant dt
#---------------------------------------------------------------------------
time_step=0.01
time_increment_fixed=0

#---------------------------------------------------------------------------
# Print interval in seconds of simulation time
#---------------------------------------------------------------------------
print_interval=60

#---------------------------------------------------------------------------
# Initial input files
#---------------------------------------------------------------------------
h_infile="../input/initc/inith/asc/case01.inith"
qx_infile="../input/initc/initqx/asc/case01.initqx"
qy_infile="../input/initc/initqy/asc/case01.initqy"

#---------------------------------------------------------------------------
# Other variables
#---------------------------------------------------------------------------
it_count=0
courant=0.45
hextra=0.001
gpu_direct_flag=0
domain_decomposition=static
open_boundaries=0
